name: Oppdater Oslo lufthavn-status

on:
  schedule:
    # Kjører kl. :07 og :37 i stedet for :00/:30 – GitHub Actions kø-forsinker cron-jobber mest
    # rundt hel/halv time siden så mange andre repos også trigger da.
    - cron: '7,37 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Last ned forrige tilstand
        uses: dawidd6/action-download-artifact@v6
        with:
          name: flydata-state
          path: .
          if_no_artifact_found: ignore

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Oppdater Datawrapper-tabell
        env:
          DATAWRAPPER_API_TOKEN: ${{ secrets.DATAWRAPPER_API_TOKEN }}
          DATAWRAPPER_CHART_ID: ${{ secrets.DATAWRAPPER_CHART_ID }}
          DATAWRAPPER_CHART_ID_CANCELLED: ${{ secrets.DATAWRAPPER_CHART_ID_CANCELLED }}
        run: python oslo_lufthavn_status.py

      - name: Lagre tilstand for neste kjøring
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flydata-state
          path: previous_summary.json
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore
